name: Deploy Angular to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'  # Cache npm dependencies for faster builds

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build Angular project
        run: npm run build -- --configuration=production

      - name: Verify build output
        run: |
          echo "Build contents:"
          ls -lah ./dist/lugare-store-admin/browser/
          echo "Total build size:"
          du -sh ./dist/lugare-store-admin/browser/

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Clean up old FTP sync state
        run: |
          lftp -u "${{ secrets.FTPUSERNAME }}","${{ secrets.FTPPASSWORD }}" ${{ secrets.FTPHOST }} <<EOF
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          cd /domains/lugarstore.net/public_html/admin/
          rm -f .ftp-deploy-sync-state.json
          bye
          EOF
        shell: bash
        continue-on-error: true  # Don't fail if sync file doesn't exist

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTPHOST }}
          username: ${{ secrets.FTPUSERNAME }}
          password: ${{ secrets.FTPPASSWORD }}
          protocol: ftp  # Explicitly set to FTP (not FTPS)
          port: 21  # Standard FTP port
          local-dir: ./dist/lugare-store-admin/browser/
          server-dir: /domains/lugarstore.net/public_html/admin/
          exclude: |
            **/.git*
            **/node_modules/**
          dangerous-clean-slate: false  # Keep existing files, only update changed ones
          timeout: 300000  # 5 minutes timeout
          log-level: verbose

